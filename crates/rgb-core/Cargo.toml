[package]
name = "rgb-core"
description = "Hardware abstraction layer for cross-vendor RGB lighting control"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["hid", "smbus", "ble", "gpu"]
# Logitech HID++ 2.0 peripherals over USB HID.
hid = ["dep:hidapi"]
# ASUS Aura (ENE) controllers on the motherboard SMBus.
smbus = []
# Bluetooth Low Energy LED strips / lamps.
ble = ["dep:btleplug", "dep:uuid"]
# MSI GeForce graphics cards (I2C over NVIDIA NvAPI on Windows).
gpu = []

[dependencies]
async-trait.workspace = true
futures.workspace = true
log.workspace = true
serde.workspace = true
tokio.workspace = true
btleplug = { version = "0.13", optional = true }
uuid = { version = "1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw"], optional = true }

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"], optional = true }
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[target.'cfg(not(any(target_os = "linux", windows)))'.dependencies]
hidapi = { version = "2.6", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
serde_json.workspace = true
