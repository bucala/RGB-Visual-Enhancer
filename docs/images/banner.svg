<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">RGB Visual Enhancer</title>
  <desc id="d">Jednotné ovládanie RGB osvetlenia pre ASUS Aura, Logitech G, MSI a Bluetooth LED pásiky</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1018"/>
      <stop offset="1" stop-color="#07080c"/>
    </linearGradient>
    <!-- Running rainbow, like an addressable LED strip. -->
    <linearGradient id="rainbow" x1="0" y1="0" x2="0.5" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#ff004c"/>
      <stop offset="0.17" stop-color="#ff9f00"/>
      <stop offset="0.33" stop-color="#f5ff00"/>
      <stop offset="0.5" stop-color="#00ff6a"/>
      <stop offset="0.67" stop-color="#00e5ff"/>
      <stop offset="0.83" stop-color="#b000ff"/>
      <stop offset="1" stop-color="#ff004c"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="0.5 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <!-- Rotating ring around the logo. -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff004c"/>
      <stop offset="0.25" stop-color="#f5ff00"/>
      <stop offset="0.5" stop-color="#00e5ff"/>
      <stop offset="0.75" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff004c"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <style>
      .led { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { .led { animation: none; opacity: .8 } }
      text { font-family: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="28" fill="url(#grid)"/>

  <!-- Logo: glowing rotating RGB ring -->
  <g transform="translate(96 84)">
    <rect x="0" y="0" width="120" height="120" rx="32" fill="none" stroke="url(#ring)" stroke-width="12" filter="url(#soft)" opacity="0.7"/>
    <rect x="0" y="0" width="120" height="120" rx="32" fill="#090b10" stroke="url(#ring)" stroke-width="9"/>
    <circle cx="60" cy="60" r="16" fill="url(#ring)" opacity="0.9"/>
  </g>

  <!-- Title -->
  <text x="262" y="138" fill="#e6e9f0" font-size="58" font-weight="800" letter-spacing="-1">RGB Visual Enhancer</text>
  <text x="264" y="182" fill="#8a93a6" font-size="24">Jednotné ovládanie RGB osvetlenia · bez bloatwaru</text>
  <text x="264" y="218" fill="#7c5cff" font-size="18" font-weight="600" letter-spacing="2">ASUS AURA · LOGITECH G · MSI GPU · BLUETOOTH LED</text>

  <!-- LED strip -->
  <rect x="96" y="262" width="1088" height="10" rx="5" fill="url(#rainbow)" filter="url(#glow)" opacity="0.85"/>
  <rect x="96" y="262" width="1088" height="10" rx="5" fill="url(#rainbow)"/>

  <!-- Pulsing LEDs -->
  <g>
    <circle class="led" cx="1000" cy="110" r="7" fill="#ff004c" style="animation-delay:0s"/>
    <circle class="led" cx="1036" cy="110" r="7" fill="#ff9f00" style="animation-delay:.2s"/>
    <circle class="led" cx="1072" cy="110" r="7" fill="#f5ff00" style="animation-delay:.4s"/>
    <circle class="led" cx="1108" cy="110" r="7" fill="#00ff6a" style="animation-delay:.6s"/>
    <circle class="led" cx="1144" cy="110" r="7" fill="#00e5ff" style="animation-delay:.8s"/>
    <circle class="led" cx="1000" cy="146" r="7" fill="#3b5bff" style="animation-delay:1s"/>
    <circle class="led" cx="1036" cy="146" r="7" fill="#7c5cff" style="animation-delay:1.2s"/>
    <circle class="led" cx="1072" cy="146" r="7" fill="#b000ff" style="animation-delay:1.4s"/>
    <circle class="led" cx="1108" cy="146" r="7" fill="#ff00a0" style="animation-delay:1.6s"/>
    <circle class="led" cx="1144" cy="146" r="7" fill="#ffffff" style="animation-delay:1.8s"/>
  </g>
</svg>
